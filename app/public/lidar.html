<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ply · point cloud viewer</title>
<style>
  :root { --fg: #e8ecf3; --muted: #9aa7b8; --accent: #ff6b00; --panel: rgba(12, 17, 26, .82); }
  html, body { margin: 0; height: 100%; background: #0b0e14; overflow: hidden; color: var(--fg); font: 13px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; }
  canvas { display: block; }
  .bar { position: fixed; z-index: 5; left: 16px; right: 16px; top: 14px; display: flex; gap: 10px; align-items: center; pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .14); background: var(--panel); backdrop-filter: blur(10px); color: var(--fg); font: 500 12px/1 inherit; }
  .pill b { font-weight: 700; letter-spacing: .3em; font-size: 11px; }
  button.pill { cursor: pointer; }
  button.pill:hover { border-color: rgba(255, 255, 255, .3); }
  .grow { flex: 1; }
  .stat { font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); background: var(--panel); border: 1px solid rgba(255, 255, 255, .1); border-radius: 10px; padding: 8px 10px; max-width: 62ch; }
  .stat.hidden { display: none; }
  .controls { position: fixed; z-index: 5; right: 16px; bottom: 14px; display: flex; gap: 10px; align-items: center; }
  .controls input[type=range] { width: 110px; accent-color: var(--accent); }
  .drop { position: fixed; inset: 0; z-index: 9; display: none; place-items: center; background: rgba(7, 11, 20, .78); border: 2px dashed rgba(255, 255, 255, .3); text-align: center; padding: 24px; }
  .drop.on { display: grid; }
  .err { color: #ffb4a0; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.25); border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="bar">
  <span class="pill"><b>PLY</b> point cloud</span>
  <span class="pill" id="name">loading…</span>
  <span class="grow"></span>
  <button class="pill" id="open">Open a .ply</button>
</div>
<div class="bar" style="top: 60px"><div class="stat" id="stat">reading the file…</div></div>
<div class="controls">
  <span class="pill" style="gap:10px">Point size <input id="size" type="range" min="0.005" max="0.2" step="0.005" value="0.04" /></span>
</div>
<div class="drop" id="drop"><div><h2 style="margin:0 0 8px">Drop a .ply here</h2><p style="margin:0;color:#9aa7b8">Read locally, never uploaded. The office scan loads unless you open another file.</p></div></div>
<input id="file" type="file" accept=".ply,application/octet-stream" hidden />

<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// The E57 itself is not on the site: it is 3.3 GB. What ships is the decimated, coloured PLY
// this viewer opens by default.
const DEFAULT_PLY = 'https://ply-api.ricco-ply.workers.dev/v1/scenes/lidar-office-1/office.ply';
const nameEl = document.getElementById('name'), statEl = document.getElementById('stat');
const sizeEl = document.getElementById('size');
const fileEl = document.getElementById('file'), dropEl = document.getElementById('drop');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0b0e14);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 5000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

let cloud = null;
function setPoints(geometry, label) {
  if (cloud) { scene.remove(cloud); cloud.geometry.dispose(); cloud.material.dispose(); }
  geometry.computeBoundingBox();
  const b = geometry.boundingBox, c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3());
  const hasColor = !!geometry.attributes.color;
  if (!hasColor) {  // a scan without colour still reads: ramp by height
    const p = geometry.attributes.position, col = new Float32Array(p.count * 3), lo = b.min.y, hi = Math.max(b.max.y, lo + 1e-3);
    for (let i = 0; i < p.count; i++) { const t = (p.getY(i) - lo) / (hi - lo); col[i * 3] = 0.15 + 0.85 * t; col[i * 3 + 1] = 0.45 + 0.35 * (1 - Math.abs(t - 0.5) * 2); col[i * 3 + 2] = 1.0 - 0.8 * t; }
    geometry.setAttribute('color', new THREE.BufferAttribute(col, 3));
  }
  const mat = new THREE.PointsMaterial({ size: +sizeEl.value, vertexColors: true, sizeAttenuation: true });
  cloud = new THREE.Points(geometry, mat);
  cloud.frustumCulled = false;
  scene.add(cloud);
  controls.target.copy(c);
  camera.position.copy(c).add(new THREE.Vector3(s.x * 0.85, Math.max(s.y * 0.7, s.x * 0.35), s.z * 0.95));
  camera.near = Math.max(0.05, s.length() / 2000); camera.far = s.length() * 6; camera.updateProjectionMatrix();
  controls.minDistance = s.length() / 500; controls.maxDistance = s.length() * 4;
  controls.update();
  nameEl.textContent = label;
  statEl.textContent = `${geometry.attributes.position.count.toLocaleString()} points · ${hasColor ? 'true colour' : 'height ramp'} · ${s.x.toFixed(1)} × ${s.y.toFixed(1)} × ${s.z.toFixed(1)} m`;
}

function fail(message) {
  statEl.innerHTML = `<span class="err">${message}</span><br>Drop a .ply on the window, or open one from the button above.`;
  nameEl.textContent = 'nothing loaded';
}

async function loadUrl(url) {
  nameEl.textContent = 'loading…';
  statEl.innerHTML = '<span class="spinner"></span> reading the cloud…';
  try {
    const geo = await new PLYLoader().loadAsync(url, e => {
      if (e && e.total) statEl.innerHTML = `<span class="spinner"></span> ${Math.round((e.loaded / e.total) * 100)}% of ${(e.total / 1048576).toFixed(0)} MB`;
    });
    setPoints(geo, decodeURIComponent(url.split('/').pop() || 'point cloud'));
  } catch (e) {
    fail(`could not load that file (${e && e.message ? e.message : e}).`);
  }
}

async function loadFile(file) {
  nameEl.textContent = file.name;
  statEl.innerHTML = '<span class="spinner"></span> reading the local file…';
  try {
    const buf = await file.arrayBuffer();
    setPoints(new PLYLoader().parse(buf), file.name);
  } catch (e) { fail(`that file did not parse as a PLY (${e && e.message ? e.message : e}).`); }
}

// ?ply= wins; without it the office scan is the default instead of a request for "null"
const param = new URLSearchParams(location.search).get('ply');
loadUrl(param || DEFAULT_PLY);

sizeEl.addEventListener('input', () => { if (cloud) cloud.material.size = +sizeEl.value; });
document.getElementById('open').addEventListener('click', () => fileEl.click());
fileEl.addEventListener('change', () => { const f = fileEl.files && fileEl.files[0]; if (f) loadFile(f); fileEl.value = ''; });
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; dropEl.classList.add('on'); });
addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove('on'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; dropEl.classList.remove('on');
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
