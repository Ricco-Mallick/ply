<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PLY check</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0e14; overflow: hidden; }
  #msg { position: fixed; left: 12px; bottom: 10px; font: 12px/1.4 ui-monospace, monospace; color: #9fb0c9; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="msg">loading…</div>
<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const msg = document.getElementById('msg');
const url = new URLSearchParams(location.search).get('ply');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0b0e14);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 2.0));
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 2000);

try {
  const geo = await new PLYLoader().loadAsync(url);
  geo.computeBoundingBox();
  const b = geo.boundingBox;
  const c = b.getCenter(new THREE.Vector3());
  const s = b.getSize(new THREE.Vector3());

  const hasColor = !!geo.attributes.color;
  const mat = new THREE.PointsMaterial({ size: 0.04, vertexColors: hasColor, color: 0xffffff, sizeAttenuation: true });
  const cloud = new THREE.Points(geo, mat);
  cloud.frustumCulled = false;
  scene.add(cloud);

  camera.position.copy(c).add(new THREE.Vector3(s.x * 0.9, s.y * 0.8, s.z * 0.9));
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(c);
  controls.update();

  msg.textContent = `${geo.attributes.position.count.toLocaleString()} points · colour ${hasColor} · ${s.x.toFixed(1)} × ${s.y.toFixed(1)} × ${s.z.toFixed(1)} m · centre ${c.x.toFixed(1)}, ${c.y.toFixed(1)}, ${c.z.toFixed(1)}`;
} catch (e) {
  msg.textContent = 'failed: ' + e;
}

renderer.setAnimationLoop(() => renderer.render(scene, camera));
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
