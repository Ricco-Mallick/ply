<style>
  :root { --fg: #e8ecf3; --muted: #9aa7b8; --accent: #ff6b00; --panel: rgba(12, 17, 26, .82); --line: rgba(255, 255, 255, .14); }

<script type="module">
import * as THREE from 'three';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// The E57 itself is not on the site (3.3 GB). What ships is the decimated, coloured PLY this viewer opens by default.
const DEFAULT_PLY = 'https://ply-api.ricco-ply.workers.dev/v1/scenes/lidar-office-1/office.ply';
const $ = id => document.getElementById(id);
const nameEl = $('name'), statEl = $('stat'), sizeEl = $('size'), fileEl = $('file'), dropEl = $('drop');
const EYE = 1.55, RADIUS = 0.25, JOIN = 0.2, CELL = 0.1, WALK = 1.4, FLY = 2.2;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE = matchMedia('(pointer: fine)').matches;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x0b0e14);
renderer.localClippingEnabled = true;
renderer.domElement.id = 'view';
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.03, 5000);
camera.rotation.order = 'YXZ';
const orbit = new OrbitControls(camera, canvas);
orbit.enableDamping = true; orbit.dampingFactor = 0.08; orbit.enabled = false;

// ---- state --------------------------------------------------------------------------------------------------------
const S = { mode: 'walk', yaw: 0, pitch: 0, pos: new THREE.Vector3(), vel: new THREE.Vector3(), speed: 1, locked: false, entered: false };
let cloud = null, room = null, views = [], anim = null, tour = null, cutCeiling = true, exposure = 1;
const ceilPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
const keys = new Set();
const joy = { x: 0, y: 0, id: null, ox: 0, oy: 0 };
let drag = null;

// ---- reading the room out of the cloud ------------------------------------------------------------------------------
/* Floor = the lowest dense height band; ceiling = the highest. A 10 cm grid over the floor: a cell is free when the
   floor was scanned there and nothing stands between knee and head height. Clearance (distance to the nearest
   non-free cell) picks the spawn and the views, and the walk mode slides along it. */
/** The lowest and the highest dense horizontal planes (floor and ceiling, either way up). */
function planes(a, n, box) {
  const BIN = 0.05, y0 = box.min.y, nb = Math.max(1, Math.ceil((box.max.y - y0) / BIN) + 1), hist = new Uint32Array(nb);
  for (let i = 0; i < n; i++) hist[Math.min(nb - 1, ((a[i * 3 + 1] - y0) / BIN) | 0)]++;
  let peak = 0; for (let i = 0; i < nb; i++) peak = Math.max(peak, hist[i]);
  const half = nb >> 1;
  let lb = 0; for (let i = 0; i < half; i++) if (hist[i] > peak * 0.25) { lb = i; break; }
  for (let i = lb, e = Math.min(nb, lb + 4); i < e; i++) if (hist[i] > hist[lb]) lb = i;  // the peak of that band
  let hb = nb - 1; for (let i = nb - 1; i > half; i--) if (hist[i] > peak * 0.25) { hb = i; break; }
  for (let i = hb, e = Math.max(0, hb - 4); i > e; i--) if (hist[i] > hist[hb]) hb = i;
  return { low: y0 + (lb + 0.5) * BIN, high: y0 + (hb + 0.5) * BIN };
}

/* Scans come either way up (an E57 can be z-up or y-down by the time it is a PLY). Furniture stands on the floor, so
   the plane with more points at desk height next to it is the floor; when that is the top one, turn the cloud over
   (180 degrees about x, which keeps it unmirrored). ?up=flip / ?up=keep overrides. */
function orientUp(geometry) {
  const pos = geometry.attributes.position, a = pos.array, n = pos.count;
  geometry.computeBoundingBox();
  const { low, high } = planes(a, n, geometry.boundingBox);
  // A tripod scanner leaves its densest points round its head, about 1.5 m above the floor: find that height first.
  const b = geometry.boundingBox, V = Math.max(0.25, Math.cbrt((b.max.x - b.min.x) * (b.max.y - b.min.y) * (b.max.z - b.min.z) / 2e6));
  const NX = Math.ceil((b.max.x - b.min.x) / V) + 1, NY = Math.ceil((b.max.y - b.min.y) / V) + 1, NZ = Math.ceil((b.max.z - b.min.z) / V) + 1;
  const vox = new Uint32Array(NX * NY * NZ);
  for (let i = 0; i < n; i++) vox[((a[i * 3] - b.min.x) / V | 0) + NX * (((a[i * 3 + 1] - b.min.y) / V | 0) + NY * ((a[i * 3 + 2] - b.min.z) / V | 0))]++;
  let vmax = 0, vk = 0; for (let k = 0; k < vox.length; k++) if (vox[k] > vmax) { vmax = vox[k]; vk = k; }
  const headY = b.min.y + ((((vk / NX) | 0) % NY) + 0.5) * V;
  const offLow = Math.abs(headY - low - 1.5), offHigh = Math.abs(high - headY - 1.5);
  // furniture stands on the floor: the plane with more points at desk height next to it (the fallback)
  let fromLow = 0, fromHigh = 0;
  for (let i = 0; i < n; i++) { const y = a[i * 3 + 1]; if (y - low > 0.4 && y - low < 1.1) fromLow++; if (high - y > 0.4 && high - y < 1.1) fromHigh++; }
  const tripod = Math.abs(offLow - offHigh) > 0.4 && Math.min(offLow, offHigh) < 0.6;
  const force = new URLSearchParams(location.search).get('up');
  const flip = force === 'flip' ? true : force === 'keep' ? false : tripod ? offHigh < offLow : fromHigh > fromLow * 1.25;
  if (flip) { for (let i = 0; i < n; i++) { a[i * 3 + 1] = -a[i * 3 + 1]; a[i * 3 + 2] = -a[i * 3 + 2]; } pos.needsUpdate = true; geometry.computeBoundingBox(); }
  level(geometry);
  return flip;
}

/* A scan a degree off level puts one end of the floor 15 cm up, into the band that counts as furniture. Fit the floor
   plane (least squares on the points near the lowest plane, twice, tightening) and rotate it flat. */
function level(geometry) {
  const pos = geometry.attributes.position, a = pos.array, n = pos.count;
  let { low } = planes(a, n, geometry.boundingBox), tilt = 0;
  for (const tol of [0.15, 0.05]) {
    let sxx = 0, sxz = 0, szz = 0, sx = 0, sz = 0, sy = 0, sxy = 0, szy = 0, m = 0;
    for (let i = 0; i < n; i++) { const y = a[i * 3 + 1]; if (Math.abs(y - low) > tol) continue;
      const x = a[i * 3], z = a[i * 3 + 2]; sxx += x * x; sxz += x * z; szz += z * z; sx += x; sz += z; sy += y; sxy += x * y; szy += z * y; m++; }
    if (m < 1000) return;
    const M = new THREE.Matrix3().set(sxx, sxz, sx, sxz, szz, sz, sx, sz, m).invert().elements;  // column-major
    const r = [sxy, szy, sy], c = [0, 1, 2].map(i => M[i] * r[0] + M[i + 3] * r[1] + M[i + 6] * r[2]);
    const nrm = new THREE.Vector3(-c[0], 1, -c[1]).normalize();
    tilt = Math.acos(Math.min(1, nrm.y)) * 180 / Math.PI;
    if (tilt < 0.05 || tilt > 10) return;  // already level, or not a floor we trust
    const q = new THREE.Quaternion().setFromUnitVectors(nrm, new THREE.Vector3(0, 1, 0));
    geometry.applyQuaternion(q); geometry.computeBoundingBox();
    low = planes(a, n, geometry.boundingBox).low;
  }
  geometry.userData.levelledDeg = tilt;
}

function analyse(pos, box) {
  const n = pos.count, a = pos.array;
  const pl = planes(a, n, box), floorY = pl.low, ceilY = Math.max(floorY + 2.2, pl.high);
  const ox = box.min.x, oz = box.min.z, W = Math.ceil((box.max.x - ox) / CELL) + 1, H = Math.ceil((box.max.z - oz) / CELL) + 1;
  const floorN = new Uint16Array(W * H), band = new Uint16Array(W * H);
  const bLo = floorY + 0.25, bHi = Math.min(floorY + 1.9, ceilY - 0.15);
  for (let i = 0; i < n; i++) {
    const y = a[i * 3 + 1]; let k;
    if (Math.abs(y - floorY) < 0.08) { k = ((a[i * 3] - ox) / CELL | 0) + ((a[i * 3 + 2] - oz) / CELL | 0) * W; if (floorN[k] < 65535) floorN[k]++; }
    else if (y > bLo && y < bHi) { k = ((a[i * 3] - ox) / CELL | 0) + ((a[i * 3 + 2] - oz) / CELL | 0) * W; if (band[k] < 65535) band[k]++; }
  }
  // 0 blocked, 1 free, 2 unscanned. Floor the scanner could not see (behind the tripod, under a desk edge) counts as
  // free when nothing stands there and scanned floor is within 60 cm; past walls the wall itself blocks it.
  const grid = new Uint8Array(W * H);
  for (let k = 0; k < W * H; k++) grid[k] = band[k] >= 2 ? 0 : floorN[k] >= 2 ? 1 : 2;
  const R = 6, near = new Uint8Array(W * H);
  for (let z = 0; z < H; z++) for (let x = 0; x < W; x++) { if (grid[x + z * W] !== 1) continue;
    for (let dz = -R; dz <= R; dz++) for (let dx = -R; dx <= R; dx++) { const nx = x + dx, nz = z + dz; if (nx >= 0 && nz >= 0 && nx < W && nz < H && dx * dx + dz * dz <= R * R) near[nx + nz * W] = 1; } }
  for (let k = 0; k < W * H; k++) if (grid[k] === 2 && near[k] && band[k] === 0) grid[k] = 1;
  // specks: a blocked cell with at most one blocked neighbour is a stray return (glass, a cable), not furniture
  for (let pass = 0; pass < 2; pass++) for (let z = 1; z < H - 1; z++) for (let x = 1; x < W - 1; x++) {
    const k = x + z * W; if (grid[k] !== 0) continue; let nb = 0, fl = 0;
    for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) { if (!dx && !dz) continue; const v = grid[k + dx + dz * W]; if (v === 0) nb++; else if (v === 1) fl++; }
    if (nb <= 1 && fl >= 5) grid[k] = 1;
  }
  // close one-cell holes in the floor (decimation leaves gaps that would trip the walker)
  const g2 = grid.slice();
  for (let z = 1; z < H - 1; z++) for (let x = 1; x < W - 1; x++) {
    const k = x + z * W; if (grid[k] !== 2 || band[k]) continue;
    let f = 0; for (const d of [1, -1, W, -W]) if (grid[k + d] === 1) f++;
    if (f >= 3) g2[k] = 1;
  }
  // clearance in cells: multi-source BFS from every non-free cell (8-neighbour)
  const clear = new Float32Array(W * H).fill(1e9), q = new Int32Array(W * H); let qh = 0, qt = 0;
  for (let k = 0; k < W * H; k++) if (g2[k] !== 1) { clear[k] = 0; q[qt++] = k; }
  while (qh < qt) {
    const k = q[qh++], x = k % W, z = (k / W) | 0, c = clear[k];
    for (let dz = -1; dz <= 1; dz++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dz) continue; const nx = x + dx, nz = z + dz; if (nx < 0 || nz < 0 || nx >= W || nz >= H) continue;
      const nk = nx + nz * W, nc = c + (dx && dz ? 1.414 : 1); if (nc < clear[nk]) { clear[nk] = nc; q[qt++] = nk; }
    }
  }
  // the biggest connected free area is the room; small pockets (under desks, outside windows) are ignored
  const comp = new Int32Array(W * H).fill(-1), sizes = []; let best = -1, bestN = 0, id = 0;
  for (let s = 0; s < W * H; s++) {
    if (g2[s] !== 1 || comp[s] >= 0 || clear[s] * CELL < JOIN) continue;
    let h = 0, t = 0, cnt = 0; q[t++] = s; comp[s] = id;
    while (h < t) { const k = q[h++]; cnt++; const x = k % W, z = (k / W) | 0;
      for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, nz = z + dz; if (nx < 0 || nz < 0 || nx >= W || nz >= H) continue;
        const nk = nx + nz * W; if (g2[nk] === 1 && comp[nk] < 0 && clear[nk] * CELL >= JOIN) { comp[nk] = id; q[t++] = nk; } } }
    sizes.push(cnt); if (cnt > bestN) { bestN = cnt; best = id; } id++;
  }
  // every room of a square metre or more is somewhere to stand; the biggest one holds the spawn
  const MIN = Math.round(1 / (CELL * CELL)), inRoom = k => comp[k] >= 0 && sizes[comp[k]] >= MIN;
  const rooms = sizes.filter(c => c >= MIN).length, areaM2 = sizes.filter(c => c >= MIN).reduce((a, c) => a + c, 0) * CELL * CELL;
  let cx = 0, cz = 0, cn = 0;
  for (let k = 0; k < W * H; k++) if (comp[k] === best) { cx += k % W; cz += (k / W) | 0; cn++; }
  cx /= cn || 1; cz /= cn || 1;
  // spawn: where the scanner stood (its densest column of points, seen from everywhere it could see), else lots of room
  // around it near the middle of the biggest room
  const col = new Uint32Array(W * H);
  for (let i = 0; i < n; i++) { const h = a[i * 3 + 1] - floorY; if (h > 1.0 && h < 2.0) col[((a[i * 3] - ox) / CELL | 0) + ((a[i * 3 + 2] - oz) / CELL | 0) * W]++; }
  let hk = -1, hv = 0;  // 50 cm windows: the scanner's head is the brightest spot in density
  for (let z = 2; z < H - 2; z++) for (let x = 2; x < W - 2; x++) { let v = 0; for (let dz = -2; dz <= 2; dz++) for (let dx = -2; dx <= 2; dx++) v += col[x + dx + (z + dz) * W]; if (v > hv) { hv = v; hk = x + z * W; } }
  let sk = -1, sv = -1e9;
  if (hk >= 0) { const hx = hk % W, hz = (hk / W) | 0;
    for (let k = 0; k < W * H; k++) if (inRoom(k) && clear[k] * CELL >= RADIUS) { const v = -Math.hypot(k % W - hx, ((k / W) | 0) - hz); if (v > sv) { sv = v; sk = k; } }
    if (sv < -15) sk = -1; }  // no room within 1.5 m of it: not a tripod scan

  const at = k => ({ x: ox + (k % W + 0.5) * CELL, z: oz + (((k / W) | 0) + 0.5) * CELL });
  return { ox, oz, W, H, grid: g2, clear, inRoom, rooms, floorY, ceilY, areaM2, spawn: sk >= 0 ? at(sk) : { x: (box.min.x + box.max.x) / 2, z: (box.min.z + box.max.z) / 2 }, centre: at(Math.round(cx) + Math.round(cz) * W), at, ok: sk >= 0 };

function cellOf(x, z) { const gx = Math.floor((x - room.ox) / CELL), gz = Math.floor((z - room.oz) / CELL); return gx < 0 || gz < 0 || gx >= room.W || gz >= room.H ? -1 : gx + gz * room.W; }

/* Views: the spawn, then spread-out spots with space around them (farthest-point sampling), each looking across the

function makeViews(box) {
  const out = [];
  // face where there is most to see: scan points 1 to 8 m away at eye level, in a 75 degree cone, sampled
  const pa = cloud.geometry.attributes.position.array, np = cloud.geometry.attributes.position.count, stride = Math.max(1, (np / 150000) | 0) * 3;
  const fy0 = room ? room.floorY : 0;
  const lookFrom = (p) => {
    const B = 36, hist = new Float32Array(B);
    for (let i = 0; i < pa.length; i += stride) { const h = pa[i + 1] - fy0; if (h < 0.3 || h > 2.6) continue;
      const dx = pa[i] - p.x, dz = pa[i + 2] - p.z, d = Math.hypot(dx, dz); if (d < 1 || d > 8) continue;
      const yaw = Math.atan2(-dx, -dz); hist[((Math.round(yaw / (2 * Math.PI) * B) % B) + B) % B] += Math.min(d, 4); }

      let v = 0; for (let j = -3; j <= 3; j++) v += hist[(i + j + B) % B];
      v *= Math.max(0.3, Math.min(run, 5));

    }

  };

    out.push({ name: 'Start', kind: 'walk', x: room.spawn.x, z: room.spawn.z, yaw: lookFrom(room.spawn), pitch: -0.08 });
    const cand = []; for (let k = 0; k < room.W * room.H; k++) if (room.inRoom(k) && room.clear[k] * CELL >= 0.45) cand.push(k);
    const picked = [room.spawn];
    for (let v = 0; v < 7 && cand.length; v++) {
      let bk = -1, bd = 0;
      for (let i = 0; i < cand.length; i += Math.max(1, cand.length / 4000 | 0)) { const p = room.at(cand[i]); let d = 1e9; for (const s of picked) d = Math.min(d, Math.hypot(p.x - s.x, p.z - s.z)); if (d > bd) { bd = d; bk = cand[i]; } }
      if (bk < 0 || bd < 1.2) break;
      const p = room.at(bk); picked.push(p);
      out.push({ name: `Inside ${out.length}`, kind: 'walk', x: p.x, z: p.z, yaw: lookFrom(p), pitch: -0.06 });
    }

  const fy = room ? room.floorY : box.min.y;

  out.push({ name: 'Floor plan', kind: 'orbit', target: new THREE.Vector3(c.x, fy, c.z), from: new THREE.Vector3(c.x, fy + Math.max(s.x, s.z) * 1.05, c.z + 0.001) });
  return out;
}

// ---- loading -------------------------------------------------------------------------------------------------------
let box = null;
function setPoints(geometry, label, keepUp = false) {
  if (cloud) { scene.remove(cloud); cloud.geometry.dispose(); cloud.material.dispose(); }
  const flipped = keepUp ? (geometry.computeBoundingBox(), false) : orientUp(geometry);
  box = geometry.boundingBox.clone();
  const s = box.getSize(new THREE.Vector3());
  const hasColor = !!geometry.attributes.color;
  if (!hasColor) {  // a scan without colour still reads: ramp by height
    const p = geometry.attributes.position, col = new Float32Array(p.count * 3), lo = box.min.y, hi = Math.max(box.max.y, lo + 1e-3);
    for (let i = 0; i < p.count; i++) { const t = (p.getY(i) - lo) / (hi - lo); col[i * 3] = 0.15 + 0.85 * t; col[i * 3 + 1] = 0.45 + 0.35 * (1 - Math.abs(t - 0.5) * 2); col[i * 3 + 2] = 1.0 - 0.8 * t; }
    geometry.setAttribute('color', new THREE.BufferAttribute(col, 3));

  room = analyse(geometry.attributes.position, box);
  ceilPlane.constant = room.ceilY - 0.12;
  const mat = new THREE.PointsMaterial({ size: +sizeEl.value, vertexColors: true, sizeAttenuation: true });
  cloud = new THREE.Points(geometry, mat);

  scene.add(cloud);

  orbit.minDistance = 0.3; orbit.maxDistance = s.length() * 3;
  views = makeViews(box);
  buildViewsMenu();
  drawMapBase();
  nameEl.textContent = label;
  statEl.textContent = `${geometry.attributes.position.count.toLocaleString()} points · ${hasColor ? 'true colour' : 'height ramp'} · ${s.x.toFixed(1)} × ${s.y.toFixed(1)} × ${s.z.toFixed(1)} m`
    + (flipped ? ' · turned right way up' : '') + (geometry.userData.levelledDeg > 0.05 ? ` · levelled ${geometry.userData.levelledDeg.toFixed(1)}°` : '') + (room.ok ? ` · ${room.areaM2.toFixed(0)} m² walkable in ${room.rooms} ${room.rooms === 1 ? 'room' : 'rooms'} · ${(room.ceilY - room.floorY).toFixed(1)} m to the ceiling` : ' · no open floor found, fly mode');

function fail(message) {

  statEl.replaceChildren(err, document.createElement('br'), 'Drop a .ply on the window, or open one from the button above.');

async function loadUrl(url) {

    const geo = await new PLYLoader().loadAsync(url, e => {
      if (e && e.total) statEl.innerHTML = `<span class="spinner"></span> ${Math.round((e.loaded / e.total) * 100)}% of ${(e.total / 1048576).toFixed(0)} MB`;
    });

// ---- modes and views -----------------------------------------------------------------------------------------------
function setMode(m) {

    }
  } else {
    orbit.enabled = false;

// ---- input ---------------------------------------------------------------------------------------------------------
addEventListener('keydown', e => {
  if (e.target.closest?.('input,textarea')) return;

  if (e.code === 'KeyO') setMode(S.mode === 'orbit' ? 'walk' : 'orbit');
  if (e.code === 'KeyH') { S.entered = !S.entered; updateHint(); }
  if (e.code === 'KeyR' && views[0]) { stopTour(); jump(views[0]); }
  if (/^Digit[1-9]$/.test(e.code)) { const v = views[+e.code.slice(5) - 1]; if (v) { stopTour(); jump(v); } }

  if (e.code === 'Backslash') setExposure(1);

addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
document.addEventListener('pointerlockchange', () => { S.locked = document.pointerLockElement === canvas; $('cross').classList.toggle('on', S.locked); });

    joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.x = joy.y = 0;
    const j = $('joy'); j.style.left = e.clientX + 'px'; j.style.top = e.clientY + 'px'; j.style.display = 'block'; j.firstElementChild.style.transform = '';

// ---- movement ------------------------------------------------------------------------------------------------------
const FW = new THREE.Vector3(), RT = new THREE.Vector3(), WANT = new THREE.Vector3();
function step(dt) {

  const r = (k.has('KeyD') || k.has('ArrowRight') ? 1 : 0) - (k.has('KeyA') || k.has('ArrowLeft') ? 1 : 0) + joy.x;

function placeCamera(dt) {

// ---- map -----------------------------------------------------------------------------------------------------------
const mapc = $('mapc'), mctx = mapc.getContext('2d'); let mapBase = null, mapT = null;
function drawMapBase() {

  const x = c.getContext('2d'), im = x.createImageData(W, H);
  for (let k = 0; k < W * H; k++) { const v = grid[k], o = k * 4;
    if (v === 1 && room.inRoom(k)) { im.data[o] = 232; im.data[o + 1] = 236; im.data[o + 2] = 243; im.data[o + 3] = 230; }
    else if (v === 1) { im.data[o] = 140; im.data[o + 1] = 150; im.data[o + 2] = 165; im.data[o + 3] = 160; }
    else if (v === 0) { im.data[o] = 255; im.data[o + 1] = 107; im.data[o + 2] = 0; im.data[o + 3] = 200; }
    else im.data[o + 3] = 0; }
  x.putImageData(im, 0, 0); mapBase = c;
  const sc = Math.min(mapc.width / W, mapc.height / H) * 0.94; mapT = { sc, x0: (mapc.width - W * sc) / 2, y0: (mapc.height - H * sc) / 2 };
}

  mctx.imageSmoothingEnabled = false; mctx.drawImage(mapBase, x0, y0, room.W * sc, room.H * sc);
  const toMap = (x, z) => [x0 + (x - room.ox) / CELL * sc, y0 + (z - room.oz) / CELL * sc];
  for (const [i, v] of views.entries()) if (v.kind === 'walk') { const [u, w] = toMap(v.x, v.z); mctx.fillStyle = 'rgba(11,14,20,.85)'; mctx.beginPath(); mctx.arc(u, w, 9, 0, 7); mctx.fill(); mctx.fillStyle = '#fff'; mctx.font = '600 10px -apple-system,Arial'; mctx.textAlign = 'center'; mctx.textBaseline = 'middle'; mctx.fillText(String(i + 1), u, w + 0.5); }

}
mapc.addEventListener('click', e => {

$('turn').onclick = () => {  // rebuild everything on the cloud turned 180 degrees about x
  if (!cloud) return; const g = cloud.geometry, a = g.attributes.position.array;
  for (let i = 0; i < a.length; i += 3) { a[i + 1] = -a[i + 1]; a[i + 2] = -a[i + 2]; }
  g.attributes.position.needsUpdate = true; cloud.geometry = new THREE.BufferGeometry(); setPoints(g, nameEl.textContent, true);
};
function setExposure(v) { exposure = Math.max(0.5, Math.min(1.8, +v.toFixed(2))); canvas.style.filter = exposure === 1 ? '' : `brightness(${exposure})`; $('expo').textContent = `☀ ${Math.round(exposure * 100)}%`; }
$('expo').onclick = () => setExposure(exposure >= 1.75 ? 0.7 : exposure + 0.1);
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
$('help').onclick = () => { S.entered = !S.entered; updateHint(); };
function enter() { S.entered = true; updateHint(); }
$('enter').onclick = () => { enter(); if (FINE && S.mode !== 'orbit') canvas.requestPointerLock?.(); };
function updateHint() {
  const li = [];
  if (S.mode === 'orbit') li.push('<kbd>Drag</kbd> turn around the scan', '<kbd>Right drag</kbd> pan', '<kbd>Scroll</kbd> zoom', '<kbd>O</kbd> or a view to step back inside');
  else if (FINE) li.push('<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move, <kbd>Shift</kbd> run', 'Click, then move the mouse to look', S.mode === 'fly' ? '<kbd>Space</kbd>/<kbd>C</kbd> up / down' : 'Walls stop you; <kbd>F</kbd> to fly through them', '<kbd>Scroll</kbd> speed', '<kbd>1</kbd>–<kbd>9</kbd> views, <kbd>R</kbd> back to the start', '<kbd>[</kbd><kbd>]</kbd> exposure, <kbd>Esc</kbd> free the mouse');
  else li.push('Left thumb: move', 'Drag the right side: look', 'Tap the map to jump there', 'Views for set spots, Orbit for the whole scan');
  $('hintList').innerHTML = li.map(x => `<li>${x}</li>`).join('');
  $('enter').textContent = S.mode === 'orbit' ? 'Got it' : FINE ? 'Click to explore' : 'Tap to explore';
  $('hint').classList.toggle('off', S.entered);
}

// ---- file opening --------------------------------------------------------------------------------------------------
const param = new URLSearchParams(location.search).get('ply');  // ?ply= wins; without it the office scan is the default
loadUrl(param || DEFAULT_PLY);
sizeEl.addEventListener('input', () => { if (cloud) cloud.material.size = +sizeEl.value; });
$('open').addEventListener('click', () => fileEl.click());
fileEl.addEventListener('change', () => { const f = fileEl.files && fileEl.files[0]; if (f) loadFile(f); fileEl.value = ''; });
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; dropEl.classList.add('on'); });
addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove('on'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; dropEl.classList.remove('on'); const f = e.dataTransfer?.files?.[0]; if (f) loadFile(f); });

// ---- loop ----------------------------------------------------------------------------------------------------------
let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (anim) { anim.t += dt; const k = easeIO(Math.min(1, anim.t / anim.dur)); anim.f(k); if (anim.t >= anim.dur) { anim = null; if (tour) tour.hold = 0; } }
  else if (tour) { tour.hold += dt; if (tour.hold > 2.2) { tour.i++; if (tour.i >= tour.list.length) stopTour(); else jump(tour.list[tour.i]); } }
  if (!anim || anim.inside === undefined) step(dt);
  placeCamera(dt);
  if (S.mode === 'orbit' && !anim) orbit.update();
  renderer.render(scene, camera);
  drawMap();
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
syncUi();
window.__lidar = { S, get room() { return room; }, get views() { return views; }, jump, setMode };
</script>
