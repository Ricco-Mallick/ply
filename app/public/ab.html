<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapel A/B · Ply</title>
<meta name="robots" content="noindex">
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 36px; display: flex; gap: 12px; align-items: center; padding: 0 12px; background: #000c; z-index: 10; }
  #bar button { background: #333; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  #bar b { font-size: 16px; }
  #stage { position: fixed; top: 36px; left: 0; right: 0; bottom: 0; }
  iframe { position: absolute; top: 0; height: 100%; border: 0; }
  body.split #fa { left: 0; width: 50%; } body.split #fb { left: 50%; width: 50%; }
  body.flip iframe { left: 0; width: 100%; }
  body.flip iframe.back { visibility: hidden; }
  .tag { position: absolute; top: 8px; z-index: 5; background: #000a; padding: 2px 10px; border-radius: 4px; font-weight: 700; font-size: 18px; pointer-events: none; }
  body.split #ta { left: 8px; } body.split #tb { left: calc(50% + 8px); }
  body.flip .tag { left: 8px; } body.flip .tag.back { display: none; }
</style>
</head>
<body class="split">
<div id="bar">
  <b>Chapel A / B</b>
  <button id="layout">Flip mode (Z)</button>
  <button id="swap">Show the other (X)</button>
  <span id="hint">Both views follow whichever one you move. Click a view, then WASD and mouse.</span>
</div>
<div id="stage">
  <div class="tag" id="ta">A</div><div class="tag back" id="tb">B</div>
  <iframe id="fa" allow="fullscreen"></iframe>
  <iframe id="fb" class="back" allow="fullscreen"></iframe>
</div>
<script>
  // Both twins come from the same camera solve, so one pose shows the same view in each.
  const frames = [document.getElementById('fa'), document.getElementById('fb')], tags = [document.getElementById('ta'), document.getElementById('tb')];
  // ?a= and ?b= take other scene.json URLs; ?quality= is passed on to both viewers
  const API = "https://ply-api.ricco-ply.workers.dev/v1/scenes/", Q = new URLSearchParams(location.search);
  const src = (k, d) => `./walk.html?ui=1&sync=1${Q.get("quality") ? "&quality=" + Q.get("quality") : ""}&scene=${encodeURIComponent(Q.get(k) || API + d + "/scene.json")}`;
  let driver = 0, front = 0;
  const setFront = i => { front = i; frames.forEach((f, k) => { f.classList.toggle('back', k !== i); tags[k].classList.toggle('back', k !== i); }); if (document.body.classList.contains('flip')) { driver = i; frames[i].contentWindow.focus(); } };
  const toggleLayout = () => { const flip = document.body.classList.toggle('flip'); document.body.classList.toggle('split', !flip); document.getElementById('layout').textContent = flip ? 'Side by side (Z)' : 'Flip mode (Z)'; setFront(front); setTimeout(() => frames.forEach(f => f.contentWindow.dispatchEvent(new Event('resize'))), 50); };
  const onKey = e => { if (e.code === 'KeyX') setFront(1 - front); else if (e.code === 'KeyZ') toggleLayout(); };
  document.getElementById('layout').onclick = toggleLayout; document.getElementById('swap').onclick = () => setFront(1 - front);
  addEventListener('keydown', onKey);
  frames.forEach((f, i) => {
    f.addEventListener('pointerenter', () => { driver = i; });
    f.addEventListener('load', () => { const w = f.contentWindow; w.addEventListener('pointerdown', () => { driver = i; }, true); w.addEventListener('keydown', e => { driver = i; onKey(e); }, true); });
  });
  const tick = () => {
    requestAnimationFrame(tick);
    const d = frames[driver].contentWindow.__ply, o = frames[1 - driver].contentWindow.__ply;
    if (!d || !o || !d.state.loaded || !o.state.loaded) return;
    if (o.state.mode !== 'fly') o.setMode('fly');  // the follower must not be pushed around by its own walking grid
    o.state.pos.set(d.state.pos.x, d.state.mode === 'walk' ? d.floorY - o.floorY + d.state.pos.y : d.state.pos.y, d.state.pos.z);
    o.state.yaw = d.state.yaw; o.pitch = d.pitch; o.vel.set(0, 0, 0);
  };
  frames[0].src = src("a", "chapel-ab-a"); frames[1].src = src("b", "chapel-ab-b");
  tick();
</script>
</body>
</html>
