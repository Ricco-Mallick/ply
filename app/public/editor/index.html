<!DOCTYPE html>
<html>
    <head>
        <title>SuperSplat · Ply editor</title>
        <meta charset="utf-8" />
        <link rel="manifest" href="./manifest.json">
        <link rel="stylesheet" href="./index.css">
        <link rel="shortcut icon" href="#">
        <meta name="description" content="SuperSplat, the open source Gaussian splat editor, served by Ply." />
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />

        <!-- Service worker: caches the editor shell so a reload is quick. -->
        <script>
            const sw = navigator.serviceWorker;
            if (sw) {
                sw.register('./sw.js')
                    .then(reg => console.log('service worker registered', reg))
                    .catch(err => console.log('failed to register service worker', err));
            }
        </script>
    </head>

    <body>
        <script type="module" src="./index.js"></script>

        <!-- Every twin opens through ?load=. The editor keeps whatever camera state it has, which in a
             fresh tab is outside the room, so once the splat count leaves zero we press the editor's own
             focus shortcut to frame it. Same for the second press: the first can land mid-import. -->
        <script>
            (() => {
                if (!new URLSearchParams(location.search).has('load')) return;
                let tries = 0, done = false;
                const press = () => document.dispatchEvent(new KeyboardEvent('keydown', { key: 'f', code: 'KeyF', bubbles: true, cancelable: true }));
                const poll = () => {
                    if (done) return;
                    const text = document.body ? document.body.innerText : '';
                    const m = text.match(/Splats\s+([\d,]+)/i);
                    if (m && parseInt(m[1].replace(/,/g, ''), 10) > 0) {
                        done = true;
                        setTimeout(press, 250);
                        setTimeout(press, 1400);
                        return;
                    }
                    if (++tries < 900) setTimeout(poll, 200);
                };
                addEventListener('DOMContentLoaded', () => setTimeout(poll, 600));
            })();
        </script>
    </body>
</html>
