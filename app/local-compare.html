<!doctype html>
<!-- Local only: one splat, framed from its bounding box, for side-by-side renders. Not part of the site. -->
<html lang="en">
<head><meta charset="utf-8"><title>compare</title><style>html,body{margin:0;height:100%;background:#0b0f17;overflow:hidden}canvas{display:block}</style></head>
<body>
<script type="module">
document.title = 'boot';
import * as THREE from 'three';
import { SparkRenderer, SplatMesh } from '@sparkjsdev/spark';
const q = new URLSearchParams(location.search);
const url = q.get('url');
const az = +(q.get('az') ?? 0) * Math.PI / 180;
const el = +(q.get('el') ?? 12) * Math.PI / 180;
const pad = +(q.get('pad') ?? 1.35);
const fov = +(q.get('fov') ?? 55);
const shift = (q.get('shift') ?? '0,0,0').split(',').map(Number);
const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(1); r.setSize(innerWidth, innerHeight); r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0f17);
const spark = new SparkRenderer({ renderer: r }); scene.add(spark);
const mesh = new SplatMesh({ url }); scene.add(mesh);
const cam = new THREE.PerspectiveCamera(fov, innerWidth / innerHeight, 0.05, 200);
cam.position.set(0, 1.6, 6); cam.lookAt(0, 1.3, 0);
// Spark starts pulling splats once the mesh is in a rendered scene, so the loop runs from the start;
// the camera is only framed after the data is in.
let framed = false, after = 0;
mesh.initialized.then(() => {
  const box = mesh.getBoundingBox(), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const radius = s.length() / 2 * pad;
  cam.near = radius / 400; cam.far = radius * 60;
  const dir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
  const target = c.clone().add(new THREE.Vector3(...shift));
  cam.position.copy(target).addScaledVector(dir, radius);
  cam.lookAt(target); cam.updateProjectionMatrix(); framed = true;
  document.title = `ready ${s.x.toFixed(1)}x${s.y.toFixed(1)}x${s.z.toFixed(1)}m n=${mesh.numSplats}`;
}).catch(e => { document.title = 'error ' + e.message; });
let frames = 0;
const loop = () => {
  r.render(scene, cam); if (!framed && (++frames % 5 === 0)) document.title = 'raf ' + frames;
  if (framed && ++after > +(q.get('frames') ?? 3)) { window.__done = 1; document.title += ' done'; return; }
  requestAnimationFrame(loop);
};
loop();
</script>
</body>
</html>
