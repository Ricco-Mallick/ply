name = "ply-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "ply-jobs"
database_id = "7ff84f46-d1c4-41be-bb91-2a2224ba02f1"

[vars]
# S3-compatible bucket (Backblaze B2): captures/<captureId>/<clip> and scenes/<jobId>/<file>; filled in by deploy.sh
S3_ENDPOINT = "https://s3.eu-central-003.backblazeb2.com"
S3_REGION = "eu-central-003"
S3_BUCKET = "ply-data-bb426385"
# origins allowed to call the write endpoints from a browser
ALLOWED_ORIGINS = "https://ricco.codes,http://localhost:5199,https://localhost:5199"
HF_REPO = "Ricco-Marcelino/ply-data"
# the GPU worker's wake-up endpoint (printed by `modal deploy pipeline/modal/ply_modal.py`): change it with the account
MODAL_TRIGGER_URL = "https://riccomarcelino--ply-trigger.us-east.modal.run"

# secrets (wrangler secret put): APP_KEY (capture app uploads/jobs), WORKER_TOKEN (GPU worker), S3_KEY_ID, S3_SECRET

# safety net for the Modal GPU worker: re-wake it when jobs wait with no worker (see scheduled() in src/index.ts)
[triggers]
crons = ["*/10 * * * *"]

# the deploy identity route, so GET / can say which code is live instead of a hand-bumped string
[version_metadata]
binding = "CF_VERSION"
